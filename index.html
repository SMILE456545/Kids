<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8cb7c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neşeli Çiftlik</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2e29; --paper: #fff8e7; --green: #8db32a; --green-d: #6f8f1c;
    --red: #f0484e; --orange: #f2a127; --orange-d: #d9800f; --card: #b7cdc4;
    --font: 'Pangolin', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a8cb7c; font-family: var(--font); color: var(--ink);
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; transition: filter .5s; }
  button { font-family: var(--font); cursor: pointer; border: none; color: inherit; }
  [hidden] { display: none !important; }

  /* круглые кнопки как в детских играх */
  .btn-round { width: 64px; height: 64px; border-radius: 50%; background: var(--green); border: 4px solid #fff;
    box-shadow: 0 0 0 2.5px var(--ink), 0 5px 0 2.5px rgba(0,0,0,.25); display: grid; place-items: center; transition: transform .12s; }
  .btn-red { width: 74px; height: 56px; border-radius: 26px; background: var(--red); border: none; box-shadow: 0 4px 0 rgba(0,0,0,.2);
    display: grid; place-items: center; transition: transform .12s; }
  .btn-round:active, .btn-red:active, .play:active, .card:active, .menu-btn:active { transform: scale(.92); }
  .btn-round svg, .btn-red svg { width: 34px; height: 34px; fill: #fff; }

  #hud .tl { position: fixed; left: calc(14px + env(safe-area-inset-left)); top: calc(14px + env(safe-area-inset-top)); display: flex; gap: 12px; align-items: flex-start; }
  #hud .tr { position: fixed; right: calc(14px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); display: flex; gap: 10px; align-items: center; }
  .btn-round.zoom { width: 38px; height: 38px; border-width: 3px; } .btn-round.zoom svg { width: 20px; height: 20px; }
  #hud #btnSettings { width: 52px; height: 40px; border-radius: 20px; } #hud #btnSettings svg { width: 24px; height: 24px; }
  /* помощник: голова в кружке справа сверху и облачко с подсказкой */
  #helper { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(62px + env(safe-area-inset-top)); display: flex; align-items: flex-start; gap: 6px; flex-direction: row-reverse; pointer-events: none; }
  #helperFace { width: 58px; height: 58px; flex: none; border-radius: 50%; background: #d9f0b8; border: 3px solid #fff; box-shadow: 0 0 0 2.5px var(--ink), 0 4px 0 2.5px rgba(0,0,0,.2);
    display: grid; place-items: center; overflow: hidden; pointer-events: auto; cursor: pointer; padding: 0; transition: transform .15s; }
  /* Джойстик: кустовый венок стоит на месте, цветок внутри ходит за пальцем */
  #joy { --j: clamp(120px, 26vmin, 190px); position: fixed; left: calc(18px + env(safe-area-inset-left));
    top: calc(var(--vvh, 100vh) - 18px - var(--j) - env(safe-area-inset-bottom)); bottom: auto; width: var(--j); height: var(--j);
    touch-action: none; pointer-events: auto; user-select: none; -webkit-user-select: none; z-index: 5; }
  #joy img { position: absolute; pointer-events: none; -webkit-user-drag: none; }
  #joyRing { inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 4px 0 rgba(0,0,0,.18)); }
  #joyKnob { left: 50%; top: 50%; width: 50%; margin: -25% 0 0 -25%; transition: transform .15s ease-out; filter: drop-shadow(0 4px 2px rgba(0,0,0,.25)); }
  #joy.on #joyKnob { transition: none; }
  /* Кнопки действий справа внизу: A — взять/дать, B — выбросить, C — дверь */
  /* размеры заданы явно (без aspect-ratio и без filter на самой кнопке): иначе в Safari/WebView зона нажатия съезжает ниже картинки */
  /* привязка сверху от реально видимой высоты (--vvh из JS): у прижатых к низу fixed-элементов мобильный браузер
     рисует их в одном месте, а нажатия ловит в другом (из-за панели браузера) — нажимаешь A, срабатывает C */
  #acts { --s: clamp(150px, 32vmin, 235px); position: fixed; right: calc(14px + env(safe-area-inset-right));
    top: calc(var(--vvh, 100vh) * .86 - 14px - var(--s) - env(safe-area-inset-bottom)); bottom: auto;
    width: var(--s); height: var(--s); pointer-events: none; z-index: 5; }
  #acts button { --b: calc(var(--s) * .46); position: absolute; display: block; width: var(--b); height: var(--b); margin: 0; padding: 0; border: 0; border-radius: 50%;
    background: none; line-height: 0; overflow: visible; -webkit-appearance: none; appearance: none; pointer-events: auto; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; transition: transform .08s; }
  #acts button img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.2)); }
  #acts button:active, #acts button.press { transform: scale(.88); }
  #acts #btnA { --b: calc(var(--s) * .54); right: 0; bottom: 0; }
  #acts #btnB { left: 0; bottom: calc(var(--s) * .04); }
  #acts #btnC { right: calc(var(--s) * .04); top: 0; }
  #helperFace img { width: 100%; height: 100%; object-fit: cover; }
  #helperMsg { max-width: min(240px, 46vw); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; padding: 4px 8px 5px; font-size: clamp(12px, 1.5vw, 15px); line-height: 1.2;
    box-shadow: 0 4px 0 rgba(0,0,0,.15); position: relative; margin-top: 8px; pointer-events: auto; cursor: pointer; transition: opacity .3s, transform .3s; }
  #helperMsg::after { content: ''; position: absolute; right: -9px; top: 14px; border: 7px solid transparent; border-left-color: var(--ink); border-right: 0; }
  #helperMsg .who { display: block; font-size: 10px; color: var(--orange-d); margin-bottom: 1px; }
  #helperMsg.hide { opacity: 0; transform: translateX(14px); pointer-events: none; }
  @media (max-width: 640px) { #helper { top: calc(60px + env(safe-area-inset-top)); } #helperMsg { max-width: min(220px, calc(100vw - 90px)); font-size: 12px; } #helperFace { width: 50px; height: 50px; } }
  @media (max-height: 500px) { #helper { top: calc(54px + env(safe-area-inset-top)); } #helperFace { width: 44px; height: 44px; } #helperMsg { max-width: min(220px, 40vw); font-size: 12px; }
    .btn-round.zoom { width: 34px; height: 34px; } #hud #btnSettings { width: 46px; height: 36px; } }

  #quest { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; padding: 3px 7px 5px; box-shadow: 0 3px 0 rgba(0,0,0,.15); max-width: min(260px, 52vw); }
  #quest .qh { font-size: 12px; line-height: 1.2; display: flex; justify-content: space-between; gap: 10px; white-space: nowrap; }
  #quest .qh b { color: var(--orange-d); }
  #qlist { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin: 2px 0 0; padding: 0; list-style: none; }
  /* сытость: голова животного и шкала */
  #qlist li.fed { display: flex; align-items: center; gap: 4px; }
  #qlist li.fed img { width: 22px; height: 22px; object-fit: contain; flex: none; }
  #qlist li.fed .bar { width: 46px; height: 9px; border: 2px solid var(--ink); border-radius: 6px; background: #e9e3d0; overflow: hidden; }
  #qlist li.fed .bar i { display: block; height: 100%; border-radius: 6px; transition: width .4s, background .4s; }
  #qlist li.fed.low img { animation: hungry 0.9s ease-in-out infinite; }
  @keyframes hungry { 50% { transform: rotate(-10deg) scale(1.08); } }

  /* диалог с героем */
  #dialog { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(780px, calc(100vw - 24px)); display: flex; align-items: flex-end; gap: 10px; cursor: pointer; animation: pop .25s ease-out; }
  #portrait { width: 112px; height: 112px; flex: none; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 0 0 2.5px var(--ink), 0 4px 0 2.5px rgba(0,0,0,.2); background: #cfe6b4; }
  #dialog .bubble { flex: 1; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 10px 16px 12px; min-height: 92px;
    position: relative; box-shadow: 0 5px 0 rgba(0,0,0,.18); margin-bottom: 6px; }
  #dialog .name { position: absolute; top: -16px; left: 16px; background: var(--orange); color: #fff; padding: 1px 12px; border-radius: 12px; border: 2.5px solid var(--ink); font-size: 16px; }
  #dlgText { font-size: clamp(17px, 2.3vw, 22px); line-height: 1.3; margin-top: 6px; }
  #dialog .next { position: absolute; right: 12px; bottom: 6px; font-size: 18px; color: var(--orange-d); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes pop { from { transform: translateX(-50%) translateY(20px); opacity: 0; } }

  /* экраны меню */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #title .logo { position: relative; margin-top: -8vh; transform: rotate(-3deg); text-align: center; }
  #title .logo .badge { display: inline-block; background: var(--orange); border: 4px solid var(--orange-d); border-radius: 40px; padding: 4px 34px 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,.18); }
  #title .logo h1 { margin: 0; font-weight: 400; font-size: clamp(26px, 8vw, 104px); line-height: 1.05; color: #fff;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 rgba(0,0,0,.2); letter-spacing: 1px; }
  #title .logo .sub { display: block; font-size: clamp(16px, 2.4vw, 24px); color: #fff; margin-top: -2px; }
  /* главный экран: нарисованный фон и кнопка «Играть» — зелёный кустик */
  #title { background: #8cc152 url(assets/bg/title.jpg) center / cover no-repeat; }
  .play { position: relative; z-index: 2; margin: 0; width: clamp(150px, 30vmin, 260px); aspect-ratio: 400 / 368; background: none; padding: 0;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.22)); animation: pulse 1.6s infinite; }
  .play img { width: 100%; height: 100%; display: block; pointer-events: none; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  /* «Играть»: кнопка чуть вырастает и сжимается до нуля, потом куст-столбик проходит слева направо и «стирает» главный экран */
  #titleLang { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right)); z-index: 3; font: inherit; font-size: 18px;
    background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 14px; padding: 5px 12px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .play.go { animation: playGo .55s ease-in forwards; pointer-events: none; }
  @keyframes playGo { 0% { transform: scale(1); } 35% { transform: scale(1.2); } 100% { transform: scale(0); opacity: 0; } }
  #title.wipe { z-index: 60; pointer-events: none; }
  #wipeBush { position: fixed; top: -3vh; left: 0; height: 106vh; width: auto; z-index: 61; pointer-events: none; will-change: transform;
    filter: drop-shadow(0 0 18px rgba(0,0,0,.35)); }
  .kid-cv { position: fixed; bottom: 0; height: min(46vh, 380px); aspect-ratio: 3/4; pointer-events: none; }
  #kidL { left: 2vw; } #kidR { right: 2vw; }

  #select { background: radial-gradient(ellipse at center, #fbf0cc 0%, #efd79d 100%); }
  .ribbon { position: relative; background: var(--orange); color: #3b2e29; font-size: clamp(28px, 5vw, 46px); padding: 4px 40px 8px; border-radius: 6px;
    box-shadow: 0 5px 0 var(--orange-d); margin-bottom: 4vh; }
  .ribbon::before, .ribbon::after { content: ''; position: absolute; top: 14px; width: 40px; height: 100%; background: var(--orange-d); z-index: -1; }
  .ribbon::before { left: -26px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 35% 50%); }
  .ribbon::after { right: -26px; clip-path: polygon(0 0, 100% 0, 65% 50%, 100% 100%, 0 100%); }
  .cards { display: flex; gap: clamp(16px, 5vw, 60px); flex-wrap: wrap; justify-content: center; }
  .card { width: clamp(150px, 30vw, 260px); background: var(--card); border: 8px solid #fff; border-radius: 28px; box-shadow: 0 0 0 3px var(--ink), 0 8px 0 3px rgba(0,0,0,.2);
    padding: 10px 10px 16px; display: flex; flex-direction: column; align-items: center; transition: transform .15s; }
  .card:hover { transform: translateY(-6px) rotate(-1deg); }
  .card canvas { width: 100%; aspect-ratio: 3/4; }
  .card .nm { background: #f6ecd8; border: 2.5px solid var(--ink); border-radius: 10px; padding: 2px 18px; font-size: clamp(20px, 3vw, 28px); margin-top: -6px; }
  .back { position: fixed; left: calc(14px + env(safe-area-inset-left)); top: calc(14px + env(safe-area-inset-top)); }

  .modal { position: fixed; inset: 0; background: rgba(40,30,25,.45); display: grid; place-items: center; padding: 20px; }
  .modal .box { background: var(--paper); border: 4px solid var(--ink); border-radius: 26px; padding: 18px 22px 22px; width: min(380px, 100%); text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
  .modal h2 { margin: 0 0 12px; font-weight: 400; font-size: 32px; }
  .menu-btn { display: block; width: 100%; margin: 10px 0; padding: 12px; font-size: 21px; border-radius: 16px; background: #fff; border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.18); }
  .menu-btn.primary { background: var(--green); color: #fff; }

  #toast { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); background: var(--paper); border: 3px solid var(--ink); border-radius: 20px;
    padding: 10px 22px; font-size: clamp(20px, 3vw, 28px); box-shadow: 0 6px 0 rgba(0,0,0,.18); pointer-events: none; transition: opacity .4s, transform .4s; text-align: center; }
  #toast.hide { opacity: 0; transform: translateX(-50%) translateY(-14px); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #a8cb7c; font-size: 30px; color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }

  @media (max-height: 500px) {
    #portrait { width: 78px; height: 78px; border-width: 4px; }
    #dialog .bubble { min-height: 70px; padding: 8px 12px 10px; }
    .btn-round { width: 52px; height: 52px; } .btn-red { width: 60px; height: 46px; }
    .btn-round svg, .btn-red svg { width: 28px; height: 28px; }
    #qlist li.fed img { width: 20px; height: 20px; } #qlist li.fed .bar { width: 40px; height: 8px; }
    .kid-cv { height: 60vh; }
    #title .logo { margin-top: -4vh; }
  }
  @media (max-width: 560px) {
    #title .logo .badge { padding: 4px 18px 10px; max-width: calc(100vw - 32px); }
    #quest .qh span.t { display: none; }
    #qlist li.fed .bar { width: 40px; }
  }
</style>
</head>
<body class="menu">
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="acts">
    <button id="btnA" aria-label="Взять / дать" data-i18n-aria="aTake"><img src="assets/items/btn_a.png" alt=""></button>
    <button id="btnB" aria-label="Выбросить" data-i18n-aria="aDrop"><img src="assets/items/btn_b.png" alt=""></button>
    <button id="btnC" aria-label="Дверь" data-i18n-aria="aDoor"><img src="assets/items/btn_c.png" alt=""></button>
  </div>
  <div id="joy"><img id="joyRing" src="assets/items/joy_ring.png" alt=""><img id="joyKnob" src="assets/items/joy_knob.png" alt=""></div>
  <div class="tl">
    <div id="quest">
      <div class="qh"><span class="t" data-i18n="fed">Сытость</span><b id="qcount"></b></div>
      <ul id="qlist"></ul>
    </div>
  </div>
  <div id="helper">
    <button id="helperFace" aria-label="Подсказка" data-i18n-aria="aHint"><img id="helperImg" src="assets/girl/head_smile.png" alt=""></button>
    <div id="helperMsg" class="hide"><span class="who" data-i18n="hero">Айлин</span><span id="helperText"></span></div>
  </div>
  <div class="tr">
    <button class="btn-round zoom" id="btnZoomOut" aria-label="Отдалить" data-i18n-aria="aZoomOut"><svg viewBox="0 0 24 24"><path d="M4 10.5h16v3H4z"/></svg></button>
    <button class="btn-round zoom" id="btnZoomIn" aria-label="Приблизить" data-i18n-aria="aZoomIn"><svg viewBox="0 0 24 24"><path d="M10.5 4h3v6.5H20v3h-6.5V20h-3v-6.5H4v-3h6.5z"/></svg></button>
    <button class="btn-red" id="btnSettings" aria-label="Настройки" data-i18n-aria="aSettings">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1L11 21h4l.4-2.7a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </div>
</div>

<script>
  /* реально видимая высота экрана → CSS-переменная --vvh (для кнопок и джойстика) */
  (function () {
    const vv = window.visualViewport;
    const upd = () => {
      const h = vv ? vv.height + vv.offsetTop : innerHeight;
      document.documentElement.style.setProperty('--vvh', Math.round(Math.min(h, innerHeight || h)) + 'px');
    };
    upd(); addEventListener('resize', upd); addEventListener('orientationchange', () => setTimeout(upd, 300));
    if (vv) { vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); }
  })();
</script>

<div id="dialog" hidden>
  <canvas id="portrait" width="224" height="224"></canvas>
  <div class="bubble"><div class="name" id="dlgName" data-i18n="hero">Айлин</div><div id="dlgText"></div><div class="next">▶</div></div>
</div>

<div id="toast" class="hide"></div>

<div id="title" class="screen" hidden>
  <button id="titleLang" aria-label="Language">🌐 <span data-i18n="langShort">RU</span></button>
  <button class="play" id="btnPlay" aria-label="Играть" data-i18n-aria="aPlay"><img src="assets/items/play_button.png" alt=""></button>
</div>

<img id="wipeBush" src="assets/items/bush_column.png" alt="" hidden>

<div id="settings" class="modal" hidden>
  <div class="box">
    <h2 data-i18n="settings">Настройки</h2>
    <button class="menu-btn primary" id="setResume" data-i18n="resume">Продолжить</button>
    <button class="menu-btn" id="setMusic">🔊 Музыка: вкл</button>
    <button class="menu-btn" id="setHelper">👧 Помощник: вкл</button>
    <button class="menu-btn" id="setLang" data-i18n="langBtn">🌐 Язык: Русский</button>
    <button class="menu-btn" id="setFull" data-i18n="fullscreen">Во весь экран</button>
    <button class="menu-btn" id="setReset" data-i18n="restart">Начать заново</button>
  </div>
</div>

<div id="loading" data-i18n="loading">Çiftlik yükleniyor…</div>

<script src="js/i18n.js"></script>
<script src="js/music.js"></script>
<script src="js/sketch.js"></script>
<script src="js/art.js"></script>
<script src="js/assets.js"></script>
<script src="js/rig.js"></script>
<script src="assets/anim/anchors.js"></script>
<script src="js/map_data.js"></script>
<script src="js/world.js"></script>
<script src="js/main.js"></script>
</body>
</html>
